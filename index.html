<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billetera Verde - Gato Vigilante</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bibliotecas de Firebase (Versión Compat para máxima compatibilidad) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- React y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAF9; margin: 0; }
        
        /* Animación de huellas de gato */
        @keyframes walk {
            0%, 100% { opacity: 0.1; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .paw-anim { animation: walk 1.2s infinite ease-in-out; }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Configuración de Firebase (Tus datos reales)
        const firebaseConfig = {
            apiKey: "AIzaSyDtmxXb4wdkelAGeISytgj5JqQ3BGZvpzM",
            authDomain: "billetera-personal-d4ca9.firebaseapp.com",
            projectId: "billetera-personal-d4ca9",
            storageBucket: "billetera-personal-d4ca9.firebasestorage.app",
            messagingSenderId: "762760084018",
            appId: "1:762760084018:web:de9213b7defd8e1dc11a2b"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        // --- COMPONENTES ---

        // Dibujo de huella de gato real (SVG)
        const CatPaw = ({ className }) => (
            <svg viewBox="0 0 100 100" className={`w-12 h-12 text-emerald-600 ${className}`}>
                <path fill="currentColor" d="M50 90c-15 0-25-10-25-25 0-15 10-25 25-25s25 10 25 25c0 15-10 25-25 25zm-25-50c-6 0-10-5-10-10s4-10 10-10 10 5 10 10-4 10-10 10zm17-15c-6 0-10-5-10-10s4-10 10-10 10 5 10 10-4 10-10 10zm16 0c-6 0-10-5-10-10s4-10 10-10 10 5 10 10-4 10-10 10zm17 15c-6 0-10-5-10-10s4-10 10-10 10 5 10 10-4 10-10 10z" />
            </svg>
        );

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [dataLoading, setDataLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('home'); // home, goals, debts
            const [accounts, setAccounts] = useState([]);
            const [goals, setGoals] = useState([]);
            const [debts, setDebts] = useState([]);
            const [showModal, setShowModal] = useState(null);

            const isDebtMode = activeTab === 'debts';
            const themeBg = isDebtMode ? 'bg-rose-800' : 'bg-emerald-800';

            useEffect(() => {
                const unsub = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    if (!u) setLoading(false);
                });
                return unsub;
            }, []);

            useEffect(() => {
                if (!user) return;
                setDataLoading(true);
                const path = `users/${user.uid}`;
                
                const unsubAcc = db.collection(path).doc('data').collection('accounts')
                    .onSnapshot(s => setAccounts(s.docs.map(d => ({id: d.id, ...d.data()}))));
                
                const unsubGoals = db.collection(path).doc('data').collection('goals')
                    .onSnapshot(s => setGoals(s.docs.map(d => ({id: d.id, ...d.data()}))));
                
                const unsubDebts = db.collection(path).doc('data').collection('debts')
                    .onSnapshot(s => {
                        setDebts(s.docs.map(d => ({id: d.id, ...d.data()})));
                        setTimeout(() => {
                            setDataLoading(false);
                            setLoading(false);
                        }, 2500);
                    });

                return () => { unsubAcc(); unsubGoals(); unsubDebts(); };
            }, [user]);

            const totals = useMemo(() => {
                const digital = accounts.filter(a => a.type === 'wallet').reduce((s,a) => s + Number(a.balance || 0), 0);
                const cash = accounts.filter(a => a.type === 'cash').reduce((s,a) => s + Number(a.balance || 0), 0);
                const debt = debts.reduce((s,d) => s + Number(d.amount || 0), 0);
                const fmt = (v) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(v);
                return { total: fmt(digital+cash), digital: fmt(digital), cash: fmt(cash), debts: fmt(debt) };
            }, [accounts, debts]);

            // --- PANTALLA DE CARGA ---
            if (loading || dataLoading) return (
                <div className="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center overflow-hidden">
                    <div className="flex gap-4 mb-8">
                        <CatPaw className="paw-anim" />
                        <CatPaw className="paw-anim delay-1" />
                        <CatPaw className="paw-anim delay-2" />
                    </div>
                    <div className="text-center z-10">
                        <h2 className="text-4xl font-black italic text-emerald-950 uppercase mb-1 tracking-tighter">GENERAL</h2>
                        <p className="text-slate-400 font-bold text-[10px] uppercase tracking-[0.4em]">Sincronizando...</p>
                    </div>
                    <div className="absolute bottom-0 w-full flex justify-center translate-y-[25%] pointer-events-none">
                        <img src="1778434269697~2.png" alt="Gata Vigilante" className="w-full max-w-md h-auto" />
                    </div>
                </div>
            );

            // --- LOGIN ---
            if (!user) return (
                <div className="min-h-screen bg-emerald-900 flex flex-col items-center justify-center p-8">
                    <div className="bg-white rounded-[4rem] p-12 w-full max-w-md shadow-2xl text-center relative z-10">
                        <div className="bg-emerald-50 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-8 text-emerald-600 font-black text-3xl italic">$</div>
                        <h1 className="text-4xl font-black italic uppercase mb-2 tracking-tighter">Verde App</h1>
                        <p className="text-slate-400 font-bold mb-10 text-[10px] uppercase tracking-widest">Tus ahorros en la nube</p>
                        <button 
                            onClick={() => auth.signInWithPopup(provider)}
                            className="w-full bg-slate-900 text-white py-6 rounded-3xl font-black uppercase tracking-widest shadow-xl active:scale-95 transition-all"
                        >
                            Ingresar con Google
                        </button>
                    </div>
                </div>
            );

            // --- INTERFAZ ---
            return (
                <div className="min-h-screen pb-44 overflow-x-hidden">
                    <header className={`${themeBg} pt-16 pb-28 px-8 rounded-b-[4.5rem] shadow-2xl transition-colors duration-700 relative overflow-hidden`}>
                        <div className="max-w-xl mx-auto relative z-10 text-white">
                            <div className="flex justify-between items-center mb-10">
                                <h1 className="text-3xl font-black italic uppercase tracking-tighter">
                                    {activeTab === 'home' ? 'GENERAL' : activeTab === 'goals' ? 'OBJETIVOS' : 'DEUDAS'}
                                </h1>
                                <button onClick={() => auth.signOut()} className="bg-white/10 p-3 rounded-full border border-white/10 text-xs font-bold">SALIR</button>
                            </div>
                            <p className="text-white/60 text-[10px] font-black uppercase tracking-widest mb-1">{isDebtMode ? 'DEUDA PENDIENTE' : 'BALANCE DISPONIBLE'}</p>
                            <h2 className="text-6xl font-black tracking-tighter mb-12 animate-in fade-in">{isDebtMode ? totals.debts : totals.total}</h2>
                            {activeTab === 'home' && (
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-white/10 backdrop-blur-md p-6 rounded-[2.5rem] border border-white/5">
                                        <p className="text-[11px] font-black uppercase text-emerald-200 mb-1">Digital</p>
                                        <p className="text-2xl font-bold">{totals.digital}</p>
                                    </div>
                                    <div className="bg-white/10 backdrop-blur-md p-6 rounded-[2.5rem] border border-white/5">
                                        <p className="text-[11px] font-black uppercase text-amber-200 mb-1">Efectivo</p>
                                        <p className="text-2xl font-bold">{totals.cash}</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="max-w-xl mx-auto px-8 -mt-12 space-y-12 relative z-20">
                        {activeTab === 'home' && (
                            <div className="space-y-10">
                                <div className="flex gap-4">
                                    <button onClick={() => setShowModal('tx')} className="flex-1 bg-white p-8 rounded-[3rem] shadow-sm flex flex-col items-center gap-2 active:scale-95 transition-all font-black text-slate-500 uppercase text-xs">OPERAR</button>
                                    <button onClick={() => setShowModal('acc')} className="flex-1 bg-emerald-500 p-8 rounded-[3rem] shadow-xl text-emerald-950 font-black text-xs uppercase active:scale-95 transition-all">CUENTA</button>
                                </div>
                                <div className="space-y-4">
                                    {accounts.map(acc => (
                                        <div key={acc.id} className="bg-white p-6 rounded-[2.5rem] shadow-sm flex items-center justify-between group">
                                            <div className="flex items-center gap-4">
                                                <div className={`w-12 h-12 rounded-2xl flex items-center justify-center font-black ${acc.type === 'wallet' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}`}>
                                                    {acc.type === 'wallet' ? 'D' : 'E'}
                                                </div>
                                                <div>
                                                    <p className="font-black text-slate-800 text-lg leading-none mb-1">{acc.name}</p>
                                                    <span className="text-[10px] font-black uppercase text-slate-400">{acc.type === 'wallet' ? 'Virtual' : 'Cash'}</span>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <p className="font-black text-slate-900 text-lg">${Number(acc.balance).toLocaleString()}</p>
                                                <button onClick={() => db.collection(`users/${user.uid}/data/accounts`).doc(acc.id).delete()} className="text-rose-200 hover:text-rose-500 font-bold">X</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'goals' && (
                            <div className="space-y-6">
                                <button onClick={() => setShowModal('goal')} className="w-full bg-white border-2 border-dashed border-emerald-200 p-10 rounded-[3.5rem] font-black text-emerald-600 text-sm uppercase">NUEVO OBJETIVO</button>
                                {goals.map(g => (
                                    <div key={g.id} className="bg-white p-8 rounded-[3rem] shadow-sm flex items-center justify-between">
                                        <div>
                                            <p className="font-black text-slate-800 text-2xl leading-none mb-2">{g.name}</p>
                                            <p className="text-xs font-bold text-slate-400 uppercase">${g.currentAmount.toLocaleString()} / ${g.targetAmount.toLocaleString()}</p>
                                        </div>
                                        <button onClick={() => setShowModal({type:'save', id:g.id})} className="bg-emerald-600 text-white px-6 py-3 rounded-2xl font-black text-xs">SUMAR</button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'debts' && (
                            <div className="space-y-6">
                                <button onClick={() => setShowModal('debt')} className="w-full bg-white border-2 border-dashed border-rose-200 p-10 rounded-[3.5rem] font-black text-rose-600 text-sm uppercase">CARGAR DEUDA</button>
                                {debts.map(d => (
                                    <div key={d.id} className="bg-white p-8 rounded-[3rem] shadow-sm flex items-center justify-between">
                                        <p className="font-black text-slate-800 text-2xl leading-none">{d.name}</p>
                                        <p className="font-black text-rose-600 text-2xl tracking-tighter">${Number(d.amount).toLocaleString()}</p>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-sm z-[90]">
                        <div className="bg-slate-900/90 backdrop-blur-2xl px-12 py-7 rounded-[3.5rem] flex justify-between items-center shadow-2xl">
                            <button onClick={() => setActiveTab('home')} className={`text-2xl transition-all ${activeTab === 'home' ? 'text-emerald-400 scale-125' : 'text-white/30'}`}>■</button>
                            <button onClick={() => setActiveTab('goals')} className={`text-2xl transition-all ${activeTab === 'goals' ? 'text-emerald-400 scale-125' : 'text-white/30'}`}>●</button>
                            <button onClick={() => setShowModal('tx')} className={`w-14 h-14 rounded-full flex items-center justify-center -mt-20 border-4 border-[#F8FAF9] text-3xl font-bold transition-all ${isDebtMode ? 'bg-rose-500' : 'bg-emerald-500'}`}>+</button>
                            <button onClick={() => setActiveTab('debts')} className={`text-2xl transition-all ${activeTab === 'debts' ? 'text-rose-400 scale-125' : 'text-white/30'}`}>▲</button>
                            <button className="text-white/30 text-2xl">H</button>
                        </div>
                    </nav>

                    {/* MODAL SIMPLE */}
                    {showModal && (
                        <div className="fixed inset-0 z-[1000] flex items-end sm:items-center justify-center bg-slate-950/80 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-md rounded-t-[4rem] p-12 shadow-2xl animate-in slide-in-from-bottom">
                                <div className="flex justify-between items-center mb-8">
                                    <h3 className="text-xl font-black italic uppercase">Cargar Datos</h3>
                                    <button onClick={() => setShowModal(null)} className="text-slate-300 font-bold text-2xl">X</button>
                                </div>
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const d = new FormData(e.target);
                                    const path = `users/${user.uid}/data`;
                                    
                                    if (showModal === 'acc') await db.collection(`${path}/accounts`).add({ name: d.get('n'), type: d.get('t'), balance: Number(d.get('b')) });
                                    if (showModal === 'goal') await db.collection(`${path}/goals`).add({ name: d.get('n'), targetAmount: Number(d.get('t')), currentAmount: 0, status: 'inactive' });
                                    if (showModal === 'debt') await db.collection(`${path}/debts`).add({ name: d.get('n'), amount: Number(d.get('a')) });
                                    if (showModal === 'tx') {
                                        const accId = d.get('acc');
                                        const acc = accounts.find(a => a.id === accId);
                                        const amt = Number(d.get('amt'));
                                        const newB = d.get('type') === 'i' ? acc.balance + amt : acc.balance - amt;
                                        await db.collection(`${path}/accounts`).doc(accId).update({ balance: newB });
                                    }
                                    if (showModal.type === 'save') {
                                        const amt = Number(d.get('amt'));
                                        const accId = d.get('acc');
                                        const acc = accounts.find(a => a.id === accId);
                                        const goal = goals.find(g => g.id === showModal.id);
                                        await db.collection(`${path}/accounts`).doc(accId).update({ balance: acc.balance - amt });
                                        await db.collection(`${path}/goals`).doc(showModal.id).update({ currentAmount: goal.currentAmount + amt });
                                    }
                                    setShowModal(null);
                                }} className="space-y-4">
                                    {showModal === 'acc' && <><input name="n" placeholder="Nombre" className="w-full p-4 bg-slate-50 rounded-2xl font-bold" /><select name="t" className="w-full p-4 bg-slate-50 rounded-2xl font-bold"><option value="wallet">Virtual</option><option value="cash">Efectivo</option></select><input name="b" type="number" placeholder="Monto" className="w-full p-4 bg-slate-50 rounded-2xl font-black" /></>}
                                    {showModal === 'goal' && <><input name="n" placeholder="Meta" className="w-full p-4 bg-slate-50 rounded-2xl font-bold" /><input name="t" type="number" placeholder="Objetivo $" className="w-full p-4 bg-slate-50 rounded-2xl font-black" /></>}
                                    {showModal === 'debt' && <><input name="n" placeholder="Entidad" className="w-full p-4 bg-slate-50 rounded-2xl font-bold" /><input name="a" type="number" placeholder="Total $" className="w-full p-4 bg-slate-50 rounded-2xl font-black" /></>}
                                    {(showModal === 'tx' || showModal.type === 'save') && <>
                                        <select name="acc" className="w-full p-4 bg-slate-50 rounded-2xl font-bold">{accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}</select>
                                        {showModal === 'tx' && <div className="flex gap-2"><label className="flex-1 p-3 bg-emerald-50 rounded-xl text-center text-xs font-black"><input type="radio" name="type" value="i" defaultChecked /> INGRESO</label><label className="flex-1 p-3 bg-rose-50 rounded-xl text-center text-xs font-black"><input type="radio" name="type" value="g" /> GASTO</label></div>}
                                        <input name="amt" type="number" placeholder="Monto $" className="w-full p-4 bg-slate-50 rounded-2xl font-black text-2xl text-center" />
                                    </>}
                                    <button className="w-full bg-slate-900 text-white py-5 rounded-3xl font-black uppercase tracking-widest mt-2">Confirmar</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
