<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera Virtual</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .num-font { font-family: 'Courier New', Courier, monospace; letter-spacing: -1px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeIn 0.4s ease-out forwards; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
        apiKey: "AIzaSyDtmxXb4wdkelAGeISytgj5JqQ3BGZvpzM",
        authDomain: "billetera-personal-d4ca9.firebaseapp.com",
        projectId: "billetera-personal-d4ca9",
        storageBucket: "billetera-personal-d4ca9.firebasestorage.app",
        messagingSenderId: "762760084018",
        appId: "1:762760084018:web:de9213b7defd8e1dc11a2b"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const provider = new firebase.auth.GoogleAuthProvider();

    const Icon = {
        Home: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>,
        Target: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
        Debt: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><path d="M7 15l2.5-2.5 2.5 2.5" transform="rotate(180 9.5 15)"/></svg>,
        Plus: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="3.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
        Play: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>,
        Pause: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>,
        Dots: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>,
        Swap: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M7 16l-4-4 4-4m10 0l4 4-4 4m-12-4h16"/></svg>,
        Dollar: () => <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
        Trash: () => <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    };

    const CircularProgress = ({ percent }) => {
        const r = 24;
        const circ = 2 * Math.PI * r;
        const safeP = isNaN(percent) ? 0 : Math.min(100, Math.max(0, percent));
        const offset = circ - (safeP / 100) * circ;
        return (
            <div className="relative w-16 h-16 flex-shrink-0">
                <svg className="w-full h-full transform -rotate-90" viewBox="0 0 64 64">
                    <circle cx="32" cy="32" r={r} stroke="#E2E8F0" strokeWidth="4" fill="transparent" />
                    <circle cx="32" cy="32" r={r} stroke="#10B981" strokeWidth="4" fill="transparent" 
                        strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" className="transition-all duration-1000"/>
                </svg>
                <div className="absolute inset-0 flex items-center justify-center">
                    <span className="text-[11px] font-black text-slate-800 leading-none num-font mt-0.5">{Math.round(safeP)}%</span>
                </div>
            </div>
        );
    };

    const App = () => {
        const { useState, useEffect, useMemo } = React;
        const [user, setUser] = useState(null);
        const [loading, setLoading] = useState(true);
        const [activeTab, setActiveTab] = useState('home'); 
        const [accounts, setAccounts] = useState([]);
        const [goals, setGoals] = useState([]);
        const [debts, setDebts] = useState([]);
        const [activeGoalMenu, setActiveGoalMenu] = useState(null);

        const isDebtMode = activeTab === 'debts';

        useEffect(() => {
            return auth.onAuthStateChanged((u) => {
                setUser(u);
                setLoading(false);
            });
        }, []);

        useEffect(() => {
            if (!user) return;
            const path = `usuarios/${user.uid}`;
            const unsubAcc = db.collection(`${path}/cuentas`).onSnapshot(s => setAccounts(s.docs.map(d => ({id: d.id, ...d.data()}))));
            const unsubGoals = db.collection(`${path}/metas`).onSnapshot(s => setGoals(s.docs.map(d => ({id: d.id, ...d.data()}))));
            const unsubDebts = db.collection(`${path}/deudas`).onSnapshot(s => setDebts(s.docs.map(d => ({id: d.id, ...d.data()}))));
            
            return () => { unsubAcc(); unsubGoals(); unsubDebts(); };
        }, [user]);

        const stats = useMemo(() => {
            const accs = accounts || [];
            const arsTotal = accs.filter(a => a.currency !== 'USD').reduce((s, a) => s + Number(a.balance || 0), 0);
            const usdTotal = accs.filter(a => a.currency === 'USD').reduce((s, a) => s + Number(a.balance || 0), 0);
            const debTotal = (debts || []).reduce((s, d) => s + (Number(d.amount || 0) - Number(d.paid || 0)), 0);
            
            const fmtARS = (v) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(v || 0);
            const fmtUSD = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(v || 0);

            return { ars: fmtARS(arsTotal), arsNum: arsTotal, usd: fmtUSD(usdTotal), usdNum: usdTotal, deb: fmtARS(debTotal) };
        }, [accounts, debts]);

        // Funciones rápidas para Modales (simplificadas para evitar errores visuales)
        const addAccount = () => {
            const name = prompt("Nombre de la cuenta (Ej: Mercado Pago):");
            if (!name) return;
            const balance = Number(prompt("Saldo inicial:") || 0);
            const isUSD = confirm("¿Es cuenta en dólares?");
            db.collection(`usuarios/${user.uid}/cuentas`).add({ name, balance, currency: isUSD ? 'USD' : 'ARS' });
        };

        const operate = () => {
            if (accounts.length === 0) return alert("Primero agregá una cuenta");
            const type = confirm("Aceptar para INGRESAR dinero, Cancelar para REGISTRAR GASTO") ? 'ingreso' : 'gasto';
            const amount = Number(prompt(`¿Cuánto vas a ${type === 'ingreso' ? 'sumar' : 'restar'}?`) || 0);
            if (!amount) return;
            
            // Toma la primera cuenta por defecto para hacer rápido
            const acc = accounts[0];
            const newBalance = type === 'ingreso' ? Number(acc.balance) + amount : Number(acc.balance) - amount;
            db.collection(`usuarios/${user.uid}/cuentas`).doc(acc.id).update({ balance: newBalance });
        };

        const addGoal = () => {
            const name = prompt("Nombre de la meta:");
            if (!name) return;
            const target = Number(prompt("Monto objetivo:") || 0);
            db.collection(`usuarios/${user.uid}/metas`).add({ name, target, status: 'active' });
        };

        const addDebt = () => {
            const name = prompt("¿A quién le debés / Qué deudá es?");
            if (!name) return;
            const amount = Number(prompt("Monto total de la deuda:") || 0);
            db.collection(`usuarios/${user.uid}/deudas`).add({ name, amount, paid: 0 });
        };

        if (loading) return <div className="min-h-screen flex items-center justify-center font-black text-emerald-600">CARGANDO...</div>;

        if (!user) return (
            <div className="min-h-screen flex flex-col items-center justify-center bg-slate-900 px-6">
                <div className="w-full max-w-md">
                    <h1 className="text-white text-4xl font-black mb-8 text-center italic">MI BILLETERA</h1>
                    <button onClick={() => auth.signInWithPopup(provider)} className="w-full bg-emerald-500 text-slate-900 py-6 rounded-[2.5rem] font-black uppercase tracking-widest shadow-2xl">Ingresar con Google</button>
                </div>
            </div>
        );

        return (
            <div className="min-h-screen pb-44 no-scrollbar relative">
                {activeGoalMenu && <div className="fixed inset-0 z-40" onClick={() => setActiveGoalMenu(null)}></div>}

                {/* Cabecera Principal */}
                <header className={`${isDebtMode ? 'bg-rose-800' : 'bg-emerald-800'} pt-16 pb-28 px-8 rounded-b-[4.5rem] shadow-2xl transition-all duration-700 relative overflow-hidden`}>
                    <div className="max-w-xl mx-auto relative z-10 text-white">
                        <div className="flex justify-between items-center mb-10">
                            <h1 className="text-3xl font-black italic uppercase tracking-tighter">
                                {activeTab === 'home' ? 'GENERAL' : activeTab === 'goals' ? 'OBJETIVOS' : 'DEUDAS'}
                            </h1>
                            <button onClick={() => auth.signOut()} className="bg-white/10 px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest">SALIR</button>
                        </div>
                        
                        <p className="text-white/60 text-[10px] font-black uppercase tracking-widest mb-1">{isDebtMode ? 'PENDIENTE' : 'BALANCE TOTAL'}</p>
                        <h2 className="text-5xl sm:text-6xl font-black tracking-tighter mb-6 num-font leading-none truncate">{isDebtMode ? stats.deb : stats.ars}</h2>
                        
                        {!isDebtMode && stats.usdNum > 0 && (
                            <div className="bg-white/10 inline-flex items-center gap-2 px-5 py-2 rounded-2xl border border-white/10 backdrop-blur-md">
                                <Icon.Dollar />
                                <span className="font-black num-font text-lg">{stats.usd}</span>
                            </div>
                        )}
                    </div>
                </header>

                {/* Cuerpo Principal */}
                <main className="max-w-xl mx-auto px-6 -mt-12 space-y-12 relative z-20">
                    
                    {/* SECCIÓN HOME */}
                    {activeTab === 'home' && (
                        <div className="space-y-10 animate-in fade-in">
                            <div className="flex gap-4">
                                <button onClick={operate} className="flex-1 bg-white p-7 rounded-[3rem] shadow-sm font-black text-emerald-600 uppercase text-[10px] tracking-widest active:scale-95 transition-all">OPERAR RÁPIDO</button>
                                <button onClick={addAccount} className="w-16 bg-emerald-500 rounded-[2.2rem] shadow-xl text-emerald-950 flex items-center justify-center active:scale-95 transition-all"><Icon.Plus /></button>
                            </div>
                            
                            <div className="space-y-4">
                                <h3 className="font-black text-slate-800 uppercase tracking-widest text-[11px] opacity-40 px-4">Tus Cuentas</h3>
                                {accounts.map(acc => (
                                    <div key={acc.id} className="bg-white p-6 rounded-[2.8rem] shadow-sm flex items-center justify-between">
                                        <div className="truncate pr-4 min-w-0">
                                            <p className="font-black text-slate-800 text-lg leading-none mb-1 truncate">{acc.name}</p>
                                            <span className={`text-[9px] font-black uppercase px-2 py-0.5 rounded-md ${acc.currency === 'USD' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-50 text-emerald-600'}`}>
                                                {acc.currency === 'USD' ? 'Dólares' : 'Pesos'}
                                            </span>
                                        </div>
                                        <div className="flex items-center gap-4 flex-shrink-0">
                                            <p className="font-black text-slate-900 text-xl tracking-tighter num-font">${Number(acc.balance || 0).toLocaleString(acc.currency === 'USD' ? 'en-US' : 'es-AR')}</p>
                                            <button onClick={() => { if(confirm("¿Borrar cuenta?")) db.collection(`usuarios/${user.uid}/cuentas`).doc(acc.id).delete() }} className="text-slate-200 hover:text-rose-500 transition-colors"><Icon.Trash /></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* SECCIÓN OBJETIVOS */}
                    {activeTab === 'goals' && (
                        <div className="space-y-6 animate-in fade-in">
                            <button onClick={addGoal} className="w-full bg-white border-2 border-dashed border-emerald-200 p-10 rounded-[4rem] font-black text-emerald-600 text-xs uppercase">+ Nueva Meta</button>
                            {goals.map(g => {
                                const curr = g.status === 'active' ? stats.arsNum : 0;
                                const percent = Math.min((curr / (Number(g.target) || 1)) * 100, 100);
                                return (
                                    <div key={g.id} className="bg-white p-6 rounded-[3.5rem] shadow-sm relative overflow-visible">
                                        <div className="flex items-center justify-between relative z-10">
                                            <div className="flex items-center gap-4 min-w-0">
                                                <CircularProgress percent={percent} />
                                                <div className="truncate">
                                                    <p className="font-black text-slate-800 text-2xl leading-none uppercase tracking-tighter italic mb-1 truncate">{g.name}</p>
                                                    <p className="text-[11px] font-bold text-slate-400 uppercase tracking-widest num-font">
                                                        ${curr.toLocaleString()} / ${Number(g.target || 0).toLocaleString()}
                                                    </p>
                                                </div>
                                            </div>
                                            <div className="flex gap-2 flex-shrink-0 relative">
                                                <button onClick={() => db.collection(`usuarios/${user.uid}/metas`).doc(g.id).update({status: g.status==='active'?'inactive':'active'}) } 
                                                    className={`p-5 rounded-[2.2rem] transition-all ${g.status==='active' ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600 shadow-lg shadow-emerald-100'}`}>
                                                    {g.status==='active' ? <Icon.Pause /> : <Icon.Play />}
                                                </button>
                                                <button onClick={() => setActiveGoalMenu(activeGoalMenu === g.id ? null : g.id)}
                                                    className="p-5 bg-slate-50 text-slate-400 rounded-[2.2rem] hover:bg-slate-100 relative z-50"><Icon.Dots /></button>
                                                
                                                {activeGoalMenu === g.id && (
                                                    <div className="absolute top-16 right-0 bg-white border border-slate-100 p-2 rounded-[2.2rem] shadow-2xl z-50 flex flex-col gap-1 min-w-[140px]">
                                                        <button onClick={() => { db.collection(`usuarios/${user.uid}/metas`).doc(g.id).delete(); setActiveGoalMenu(null); }} className="flex items-center gap-3 w-full p-4 hover:bg-rose-50 text-rose-500 rounded-2xl text-[11px] font-black uppercase">Borrar</button>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* SECCIÓN DEUDAS (Acá se cortaba antes) */}
                    {activeTab === 'debts' && (
                        <div className="space-y-6 animate-in fade-in">
                            <button onClick={addDebt} className="w-full bg-white border-2 border-dashed border-rose-200 p-10 rounded-[4rem] font-black text-rose-600 text-xs uppercase">+ Cargar Deuda</button>
                            {debts.map(d => (
                                <div key={d.id} className="bg-white p-7 rounded-[3.5rem] shadow-sm flex items-center justify-between">
                                    <div className="min-w-0 truncate pr-2">
                                        <p className="font-black text-slate-800 text-2xl leading-none uppercase tracking-tighter italic mb-1 truncate">{d.name}</p>
                                        <p className="text-[11px] font-bold text-slate-400 uppercase tracking-widest num-font">
                                            Pagaste: ${Number(d.paid || 0).toLocaleString()} / Total: ${Number(d.amount || 0).toLocaleString()}
                                        </p>
                                    </div>
                                    <div className="flex gap-2 flex-shrink-0">
                                        <button onClick={() => {
                                            const add = prompt('¿Cuánto pagaste de esta deuda recién?');
                                            if(add && !isNaN(add)) db.collection(`usuarios/${user.uid}/deudas`).doc(d.id).update({ paid: Number(d.paid || 0) + Number(add) });
                                        }} className="p-4 bg-emerald-50 text-emerald-600 rounded-[2rem]"><Icon.Plus /></button>
                                        <button onClick={() => { if(confirm("¿Borrar deuda?")) db.collection(`usuarios/${user.uid}/deudas`).doc(d.id).delete() }} className="p-4 bg-rose-50 text-rose-500 rounded-[2rem]"><Icon.Trash /></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </main>

                {/* BARRA DE NAVEGACIÓN INFERIOR */}
                <nav className="fixed bottom-6 left-6 right-6 bg-slate-900 p-4 rounded-[3rem] shadow-2xl flex justify-around items-center z-50">
                    <button onClick={() => setActiveTab('home')} className={`p-4 rounded-[2rem] transition-all ${activeTab === 'home' ? 'bg-emerald-500 text-emerald-950 shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                        <Icon.Home />
                    </button>
                    <button onClick={() => setActiveTab('goals')} className={`p-4 rounded-[2rem] transition-all ${activeTab === 'goals' ? 'bg-emerald-500 text-emerald-950 shadow-lg' : 'text-slate-400 hover:text-white'}`}>
                        <Icon.Target />
                    </button>
                    <button onClick={() => setActiveTab('debts')} className={`p-4 rounded-[2rem] transition-all ${activeTab === 'debts' ? 'bg-rose-500 text-white shadow-lg shadow-rose-500/30' : 'text-slate-400 hover:text-white'}`}>
                        <Icon.Debt />
                    </button>
                </nav>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
