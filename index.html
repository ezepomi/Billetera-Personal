<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cydonia Industries - Finance</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Font: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #F8FAF9; 
            margin: 0; 
            touch-action: manipulation; 
            overflow-x: hidden; 
        }
        
        @keyframes walk {
            0%, 100% { opacity: 0.1; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .paw { animation: walk 1.2s infinite ease-in-out; }
        .d1 { animation-delay: 0.2s; }
        .d2 { animation-delay: 0.4s; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Asegura que los números siempre tengan el mismo ancho */
        .num-font { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
        
        /* Animación suave para el menú (...) */
        .menu-in {
            animation: menuIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes menuIn {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDtmxXb4wdkelAGeISytgj5JqQ3BGZvpzM",
            authDomain: "billetera-personal-d4ca9.firebaseapp.com",
            projectId: "billetera-personal-d4ca9",
            storageBucket: "billetera-personal-d4ca9.firebasestorage.app",
            messagingSenderId: "762760084018",
            appId: "1:762760084018:web:de9213b7defd8e1dc11a2b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        // --- ICONOS ---
        const Icon = {
            Home: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
            Target: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            Debt: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><path d="M7 15l2.5-2.5 2.5 2.5" transform="rotate(180 9.5 15)"/></svg>,
            Plus: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Play: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>,
            Pause: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>,
            Dots: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>,
            Edit: () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
            Trash: () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Paw: ({ className }) => (
                <svg viewBox="0 0 100 100" className={className} fill="currentColor">
                    <path d="M50 85c-12 0-22-8-22-22 0-12 10-22 22-22s22 10 22 22c0 14-10 22-22 22zM28 38c-5 0-9-4-9-9s4-9 9-9 9 4 9 9-4 9-9 9zm16-14c-5 0-9-4-9-9s4-9 9-9 9 4 9 9-4 9-9 9zm24 0c-5 0-9-4-9-9s4-9 9-9 9 4 9 9-4 9-9 9zm16 14c-5 0-9-4-9-9s4-9 9-9 9 4 9 9-4 9-9 9z" />
                </svg>
            )
        };

        const CircularProgress = ({ percent }) => {
            const r = 18;
            const circ = 2 * Math.PI * r;
            const safeP = isNaN(percent) ? 0 : Math.min(100, Math.max(0, percent));
            const offset = circ - (safeP / 100) * circ;
            return (
                <div className="relative flex items-center justify-center w-16 h-16 flex-shrink-0">
                    <svg className="w-full h-full transform -rotate-90">
                        <circle cx="20" cy="20" r={r} stroke="#E2E8F0" strokeWidth="3" fill="transparent" />
                        <circle cx="20" cy="20" r={r} stroke="#10B981" strokeWidth="3" fill="transparent" 
                            strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" className="transition-all duration-1000"/>
                    </svg>
                    <div className="absolute inset-0 flex items-center justify-center">
                        <span className="text-[11px] font-black text-slate-800 leading-none">{Math.round(safeP)}%</span>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [dataLoading, setDataLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('home'); 
            const [accounts, setAccounts] = useState([]);
            const [goals, setGoals] = useState([]);
            const [debts, setDebts] = useState([]);
            const [modal, setModal] = useState(null);
            const [activeGoalMenu, setActiveGoalMenu] = useState(null);

            const isDebtMode = activeTab === 'debts';

            useEffect(() => {
                return auth.onAuthStateChanged((u) => {
                    setUser(u);
                    setLoading(false);
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                setDataLoading(true);
                const path = `usuarios/${user.uid}`;
                const unsubAcc = db.collection(`${path}/cuentas`).onSnapshot(s => setAccounts(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubGoals = db.collection(`${path}/metas`).onSnapshot(s => setGoals(s.docs.map(d => ({id: d.id, ...d.data()}))));
                const unsubDebts = db.collection(`${path}/deudas`).onSnapshot(s => {
                    setDebts(s.docs.map(d => ({id: d.id, ...d.data()})));
                    setTimeout(() => setDataLoading(false), 2000);
                });
                return () => { unsubAcc(); unsubGoals(); unsubDebts(); };
            }, [user]);

            const stats = useMemo(() => {
                const accs = accounts || [];
                const dts = debts || [];
                const dig = accs.filter(a => a.type === 'wallet').reduce((s, a) => s + Number(a.balance || 0), 0);
                const cash = accs.filter(a => a.type === 'cash').reduce((s, a) => s + Number(a.balance || 0), 0);
                const rawTotal = dig + cash;
                const debTotal = dts.reduce((s, d) => s + (Number(d.amount || 0) - Number(d.paid || 0)), 0);
                const fmt = (v) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(v);
                return { total: fmt(rawTotal), totalNum: rawTotal, dig: fmt(dig), cash: fmt(cash), deb: fmt(debTotal) };
            }, [accounts, debts]);

            // --- CARGA ---
            if (loading || (user && dataLoading)) return (
                <div className="fixed inset-0 bg-white flex flex-col items-center justify-center overflow-hidden">
                    <img src="1000250047.png" className="absolute inset-0 w-full h-full object-cover" />
                    <div className="relative z-10 flex gap-4 mt-12">
                        <Icon.Paw className="w-12 h-12 text-emerald-600/60 paw" />
                        <Icon.Paw className="w-12 h-12 text-emerald-600/60 paw d1" />
                        <Icon.Paw className="w-12 h-12 text-emerald-600/60 paw d2" />
                    </div>
                </div>
            );

            // --- LOGIN ---
            if (!user) return (
                <div className="min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
                    <img src="1000250047.png" className="absolute inset-0 w-full h-full object-cover" />
                    <div className="relative z-10 mt-16 w-full px-10 max-w-md">
                        <button 
                            onClick={() => auth.signInWithPopup(provider)} 
                            className="w-full bg-slate-900/95 backdrop-blur-md text-white py-6 rounded-[2.5rem] font-black uppercase tracking-widest shadow-2xl active:scale-95 transition-all"
                        >
                            Ingresar con Google
                        </button>
                    </div>
                </div>
            );

            // --- DASHBOARD ---
            return (
                <div className="min-h-screen pb-44 no-scrollbar">
                    <header className={`${isDebtMode ? 'bg-rose-800' : 'bg-emerald-800'} pt-16 pb-28 px-8 rounded-b-[4.5rem] shadow-2xl transition-all duration-700 relative overflow-hidden`}>
                        <div className="max-w-xl mx-auto relative z-10 text-white">
                            <div className="flex justify-between items-center mb-10">
                                <h1 className="text-3xl font-black italic uppercase tracking-tighter">
                                    {activeTab === 'home' ? 'GENERAL' : activeTab === 'goals' ? 'OBJETIVOS' : 'DEUDAS'}
                                </h1>
                                <button onClick={() => auth.signOut()} className="bg-white/10 px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest">SALIR</button>
                            </div>
                            <p className="text-white/60 text-[11px] font-black uppercase tracking-[0.2em] mb-1">{isDebtMode ? 'PENDIENTE' : 'DISPONIBLE'}</p>
                            <h2 className="text-5xl sm:text-6xl font-black tracking-tighter mb-10 num-font leading-none overflow-hidden">{isDebtMode ? stats.deb : stats.total}</h2>
                            {activeTab === 'home' && (
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-white/10 p-5 rounded-[2.5rem] border border-white/10 flex flex-col justify-center min-h-[90px] overflow-hidden">
                                        <p className="text-[10px] font-black uppercase text-emerald-300 mb-1">Digital</p>
                                        <p className="font-bold num-font text-lg sm:text-xl truncate">{stats.dig}</p>
                                    </div>
                                    <div className="bg-white/10 p-5 rounded-[2.5rem] border border-white/10 flex flex-col justify-center min-h-[90px] overflow-hidden">
                                        <p className="text-[10px] font-black uppercase text-amber-300 mb-1">Efectivo</p>
                                        <p className="font-bold num-font text-lg sm:text-xl truncate">{stats.cash}</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="max-w-xl mx-auto px-6 -mt-12 space-y-12 relative z-20">
                        {/* HOME */}
                        {activeTab === 'home' && (
                            <div className="space-y-10 animate-in fade-in">
                                <div className="flex gap-4">
                                    <button onClick={() => setModal('tx')} className="flex-1 bg-white p-7 rounded-[3rem] shadow-sm font-black text-slate-500 uppercase text-[10px] tracking-widest active:scale-95">OPERAR</button>
                                    <button onClick={() => setModal('acc')} className="flex-1 bg-emerald-500 p-7 rounded-[3rem] shadow-xl text-emerald-950 font-black text-[10px] uppercase tracking-widest active:scale-95">CUENTA</button>
                                </div>
                                <section className="space-y-4">
                                    <h3 className="font-black text-slate-800 uppercase tracking-widest text-[11px] opacity-40 px-4">Tus Activos</h3>
                                    {accounts.map(acc => (
                                        <div key={acc.id} className="bg-white p-6 rounded-[2.5rem] shadow-sm flex items-center justify-between">
                                            <div className="truncate pr-4 min-w-0">
                                                <p className="font-black text-slate-800 text-lg leading-none mb-1 truncate">{acc.name}</p>
                                                <span className="text-[10px] font-black uppercase text-slate-400">{acc.type === 'wallet' ? 'Virtual' : 'Efectivo'}</span>
                                            </div>
                                            <div className="flex items-center gap-4 flex-shrink-0">
                                                <p className="font-black text-slate-900 text-xl tracking-tighter num-font">${Number(acc.balance).toLocaleString('es-AR')}</p>
                                                <button onClick={() => db.collection(`usuarios/${user.uid}/cuentas`).doc(acc.id).delete()} className="text-slate-200 hover:text-rose-500 transition-colors"><Icon.Trash /></button>
                                            </div>
                                        </div>
                                    ))}
                                </section>
                            </div>
                        )}

                        {/* OBJETIVOS */}
                        {activeTab === 'goals' && (
                            <div className="space-y-6 animate-in fade-in">
                                <button onClick={() => setModal('goal')} className="w-full bg-white border-2 border-dashed border-emerald-200 p-10 rounded-[4rem] font-black text-emerald-600 text-xs uppercase">+ Nueva Meta</button>
                                {goals.map(g => {
                                    const current = g.status === 'active' ? stats.totalNum : 0;
                                    const percent = Math.min((current / (Number(g.target) || 1)) * 100, 100);
                                    return (
                                        <div key={g.id} className="bg-white p-6 rounded-[3.5rem] shadow-sm relative overflow-visible">
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-4 min-w-0">
                                                    <CircularProgress percent={percent} />
                                                    <div className="truncate">
                                                        <p className="font-black text-slate-800 text-2xl leading-none uppercase tracking-tighter italic mb-1 truncate">{g.name}</p>
                                                        <p className="text-[11px] font-bold text-slate-400 uppercase tracking-widest num-font">
                                                            ${current.toLocaleString()} / ${Number(g.target || 0).toLocaleString()}
                                                        </p>
                                                    </div>
                                                </div>
                                                <div className="flex gap-2 flex-shrink-0 relative">
                                                    <button 
                                                        onClick={() => db.collection(`usuarios/${user.uid}/metas`).doc(g.id).update({status: g.status==='active'?'inactive':'active'})} 
                                                        className={`p-4 rounded-[1.8rem] transition-all ${g.status==='active' ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600 shadow-lg shadow-emerald-100'}`}
                                                    >
                                                        {g.status==='active' ? <Icon.Pause /> : <Icon.Play />}
                                                    </button>
                                                    
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); setActiveGoalMenu(activeGoalMenu === g.id ? null : g.id); }}
                                                        className="p-4 bg-slate-50 text-slate-400 rounded-[1.8rem] hover:bg-slate-100"
                                                    >
                                                        <Icon.Dots />
                                                    </button>

                                                    {activeGoalMenu === g.id && (
                                                        <div className="absolute top-16 right-0 bg-white border border-slate-100 p-2 rounded-[2rem] shadow-2xl z-[50] flex flex-col gap-1 min-w-[130px] menu-in">
                                                            <button 
                                                                onClick={() => { setModal({type:'editGoal', g}); setActiveGoalMenu(null); }}
                                                                className="flex items-center gap-3 w-full p-4 hover:bg-emerald-50 text-slate-600 rounded-2xl text-[10px] font-black uppercase transition-colors"
                                                            >
                                                                <Icon.Edit /> Editar
                                                            </button>
                                                            <button 
                                                                onClick={() => { db.collection(`usuarios/${user.uid}/metas`).doc(g.id).delete(); setActiveGoalMenu(null); }}
                                                                className="flex items-center gap-3 w-full p-4 hover:bg-rose-50 text-rose-500 rounded-2xl text-[10px] font-black uppercase transition-colors"
                                                            >
                                                                <Icon.Trash /> Borrar
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* DEUDAS */}
                        {activeTab === 'debts' && (
                            <div className="space-y-6 animate-in fade-in">
                                <button onClick={() => setModal('debt')} className="w-full bg-white border-2 border-dashed border-rose-200 p-10 rounded-[4rem] font-black text-rose-600 text-xs uppercase">+ Cargar Deuda</button>
                                {debts.map(d => (
                                    <div key={d.id} className="bg-white p-6 rounded-[3.5rem] shadow-sm flex items-center justify-between">
                                        <div className="min-w-0 truncate pr-2">
                                            <p className="font-black text-slate-800 text-2xl leading-none uppercase tracking-tighter italic mb-1 truncate">{d.name}</p>
                                            <p className="text-[10px] font-bold text-rose-500 uppercase tracking-widest num-font">
                                                Restan: ${(Number(d.amount) - Number(d.paid || 0)).toLocaleString()}
                                            </p>
                                        </div>
                                        <div className="flex gap-2 flex-shrink-0">
                                            <button onClick={() => setModal({type:'pay', d})} className="bg-emerald-500 text-white px-5 py-4 rounded-[1.5rem] font-black text-[10px] uppercase shadow-lg shadow-emerald-100 active:scale-90">PAGAR</button>
                                            <button onClick={() => setModal({type:'editDebt', d})} className="p-4 bg-slate-50 text-slate-400 rounded-2xl"><Icon.Edit /></button>
                                            <button onClick={() => db.collection(`usuarios/${user.uid}/deudas`).doc(d.id).delete()} className="p-4 bg-rose-50 text-rose-400 rounded-2xl"><Icon.Trash /></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* NAVBAR */}
                    <nav className="fixed bottom-10 left-1/2 -translate-x-1/2 w-[90%] max-w-sm z-[90]" onClick={() => setActiveGoalMenu(null)}>
                        <div className="bg-slate-900/95 backdrop-blur-3xl px-12 py-8 rounded-[4rem] flex justify-between items-center shadow-2xl">
                            <button onClick={() => setActiveTab('home')} className={activeTab === 'home' ? 'text-emerald-400 scale-125 transition-all' : 'text-white/20'}><Icon.Home /></button>
                            <button onClick={() => setActiveTab('goals')} className={activeTab === 'goals' ? 'text-emerald-400 scale-125 transition-all' : 'text-white/20'}><Icon.Target /></button>
                            <button onClick={() => setModal('tx')} className={`w-14 h-14 rounded-full flex items-center justify-center -mt-24 border-4 border-[#F8FAF9] shadow-xl ${isDebtMode ? 'bg-rose-500 text-white' : 'bg-emerald-500 text-emerald-950'}`}><Icon.Plus /></button>
                            <button onClick={() => setActiveTab('debts')} className={isDebtMode ? 'text-rose-400 scale-125 transition-all' : 'text-white/20'}><Icon.Debt /></button>
                            <button className="text-white/20"><svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/></svg></button>
                        </div>
                    </nav>

                    {/* MODALES */}
                    {modal && (
                        <div className="fixed inset-0 z-[1000] flex items-end sm:items-center justify-center bg-slate-950/80 backdrop-blur-md px-0 sm:px-4">
                            <div className="bg-white w-full max-w-md rounded-t-[5rem] p-12 shadow-2xl animate-in slide-in-from-bottom">
                                <div className="flex justify-between items-center mb-10 px-2">
                                    <h3 className="text-2xl font-black italic uppercase tracking-tighter">
                                        {modal?.type === 'pay' ? 'Abonar' : modal?.type === 'editGoal' || modal?.type === 'editDebt' ? 'Editar' : 'Cargar'}
                                    </h3>
                                    <button onClick={() => setModal(null)} className="text-slate-300 font-black text-3xl p-2 transition-transform hover:scale-110">×</button>
                                </div>
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const d = new FormData(e.target);
                                    const p = `usuarios/${user.uid}`;
                                    
                                    if (modal === 'acc') await db.collection(`${p}/cuentas`).add({ name: d.get('n'), type: d.get('t'), balance: Number(d.get('b')) });
                                    if (modal === 'goal') await db.collection(`${p}/metas`).add({ name: d.get('n'), target: Number(d.get('t')), status: 'inactive' });
                                    if (modal?.type === 'editGoal') await db.collection(`${p}/metas`).doc(modal.g.id).update({ name: d.get('n'), target: Number(d.get('t')) });
                                    if (modal === 'debt') await db.collection(`${p}/deudas`).add({ name: d.get('n'), amount: Number(d.get('a')), paid: 0 });
                                    if (modal?.type === 'editDebt') await db.collection(`${p}/deudas`).doc(modal.d.id).update({ name: d.get('n'), amount: Number(d.get('a')) });
                                    if (modal?.type === 'pay') await db.collection(`${p}/deudas`).doc(modal.d.id).update({ paid: (Number(modal.d.paid)||0) + Number(d.get('amt')) });
                                    if (modal === 'tx') {
                                        const aid = d.get('acc'); const acc = accounts.find(a => a.id === aid);
                                        const amt = Number(d.get('amt')); const newB = d.get('type') === 'i' ? Number(acc.balance) + amt : Number(acc.balance) - amt;
                                        await db.collection(`${p}/cuentas`).doc(aid).update({ balance: newB });
                                    }
                                    setModal(null);
                                }} className="space-y-6">
                                    {modal === 'acc' && <><input name="n" required placeholder="Nombre" className="w-full p-5 bg-slate-50 rounded-2xl font-bold" /><select name="t" className="w-full p-5 bg-slate-50 rounded-2xl font-bold"><option value="wallet">Virtual</option><option value="cash">Efectivo</option></select><input name="b" type="number" required placeholder="Saldo inicial" className="w-full p-5 bg-slate-50 rounded-2xl font-black text-2xl" /></>}
                                    {(modal === 'goal' || modal?.type === 'editGoal') && <><input name="n" defaultValue={modal?.g?.name} required placeholder="Nombre meta" className="w-full p-5 bg-slate-50 rounded-2xl font-bold" /><input name="t" defaultValue={modal?.g?.target} type="number" required placeholder="Objetivo $" className="w-full p-5 bg-slate-50 rounded-2xl font-black text-3xl" /></>}
                                    {(modal === 'debt' || modal?.type === 'editDebt') && <><input name="n" defaultValue={modal?.d?.name} required placeholder="Entidad" className="w-full p-5 bg-slate-50 rounded-2xl font-bold" /><input name="a" defaultValue={modal?.d?.amount} type="number" required placeholder="Monto total $" className="w-full p-5 bg-slate-50 rounded-2xl font-black text-3xl text-rose-600" /></>}
                                    {modal?.type === 'pay' && <input name="amt" type="number" required placeholder="¿Cuánto abonás? $" className="w-full p-6 bg-slate-50 rounded-2xl font-black text-5xl text-center text-emerald-600" />}
                                    {modal === 'tx' && <>
                                        <select name="acc" required className="w-full p-5 bg-slate-50 rounded-2xl font-bold">{accounts.map(a => <option key={a.id} value={a.id}>{a.name} (${(a.balance||0).toLocaleString()})</option>)}</select>
                                        <div className="flex gap-4"><label className="flex-1 p-4 bg-emerald-50 rounded-2xl text-center font-black text-xs cursor-pointer"><input type="radio" name="type" value="i" defaultChecked className="mr-2" /> INGRESO</label><label className="flex-1 p-4 bg-rose-50 rounded-2xl text-center font-black text-xs cursor-pointer"><input type="radio" name="type" value="g" className="mr-2" /> GASTO</label></div>
                                        <input name="amt" type="number" required placeholder="Monto $" className="w-full p-6 bg-slate-50 rounded-2xl font-black text-5xl text-center" />
                                    </>}
                                    <button className="w-full bg-slate-900 text-white py-6 rounded-[2rem] font-black uppercase tracking-widest shadow-xl">Confirmar</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
