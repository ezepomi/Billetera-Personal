<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Billetera Verde - Gato Vigilante</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs (Versión Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #F8FAF9; 
            margin: 0; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Animación de huellas reales de gato */
        @keyframes pawWave {
            0%, 100% { opacity: 0.1; transform: scale(0.8) translateY(0); }
            50% { opacity: 1; transform: scale(1.1) translateY(-15px); }
        }
        .paw-print { animation: pawWave 1.4s infinite ease-in-out; }
        .p1 { animation-delay: 0s; }
        .p2 { animation-delay: 0.3s; }
        .p3 { animation-delay: 0.6s; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Efecto de cristal para el header */
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONFIGURACIÓN DE FIREBASE (Tus credenciales) ---
        const firebaseConfig = {
            apiKey: "AIzaSyDtmxXb4wdkelAGeISytgj5JqQ3BGZvpzM",
            authDomain: "billetera-personal-d4ca9.firebaseapp.com",
            projectId: "billetera-personal-d4ca9",
            storageBucket: "billetera-personal-d4ca9.firebasestorage.app",
            messagingSenderId: "762760084018",
            appId: "1:762760084018:web:de9213b7defd8e1dc11a2b"
        };

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        // --- COMPONENTES ---

        // Huella de gato realista dibujada por coordenadas SVG
        const RealisticPaw = ({ className }) => (
            <svg viewBox="0 0 100 100" className={`w-14 h-14 text-emerald-600 ${className}`}>
                <path fill="currentColor" d="M50 85c-12 0-22-8-22-22 0-12 10-22 22-22s22 10 22 22c0 14-10 22-22 22zM28 38c-5 0-9-4-9-9s4-9 9-9 9 4 9 9-4 9-9 9zm16-14c-5 0-9-4-9-9s4-9 9-9 9 4 9 9-4 9-9 9zm24 0c-5 0-9-4-9-9s4-9 9-9 9 4 9 9-4 9-9 9zm16 14c-5 0-9-4-9-9s4-9 9-9 9 4 9 9-4 9-9 9z" />
            </svg>
        );

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [dataLoading, setDataLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('home'); // home, goals, debts
            const [accounts, setAccounts] = useState([]);
            const [goals, setGoals] = useState([]);
            const [debts, setDebts] = useState([]);
            const [showModal, setShowModal] = useState(null);

            const isDebtMode = activeTab === 'debts';
            const themeBg = isDebtMode ? 'bg-rose-800' : 'bg-emerald-800';
            const buttonColor = isDebtMode ? 'bg-rose-500' : 'bg-emerald-500';

            useEffect(() => {
                const unsubAuth = auth.onAuthStateChanged((u) => {
                    setUser(u);
                    if (!u) {
                        setLoading(false);
                    }
                });
                return unsubAuth;
            }, []);

            useEffect(() => {
                if (!user) return;
                setDataLoading(true);
                const path = `users/${user.uid}/data`;
                
                const unsubAcc = db.collection(`${path}/accounts`).onSnapshot(s => setAccounts(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubGoals = db.collection(`${path}/goals`).onSnapshot(s => setGoals(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubDebts = db.collection(`${path}/debts`).onSnapshot(s => {
                    setDebts(s.docs.map(d => ({id:d.id, ...d.data()})));
                    // Delay para ver al gato vigilando
                    setTimeout(() => {
                        setDataLoading(false);
                        setLoading(false);
                    }, 3000);
                });

                return () => { unsubAcc(); unsubGoals(); unsubDebts(); };
            }, [user]);

            const totals = useMemo(() => {
                const digital = accounts.filter(a => a.type === 'wallet').reduce((s,a) => s + Number(a.balance || 0), 0);
                const cash = accounts.filter(a => a.type === 'cash').reduce((s,a) => s + Number(a.balance || 0), 0);
                const debt = debts.reduce((s,d) => s + Number(d.amount || 0), 0);
                const fmt = (v) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(v);
                return { total: fmt(digital+cash), digital: fmt(digital), cash: fmt(cash), debts: fmt(debt) };
            }, [accounts, debts]);

            const handleLogin = async () => {
                try {
                    await auth.signInWithPopup(provider);
                } catch (e) {
                    auth.signInWithRedirect(provider);
                }
            };

            // --- PANTALLA DE CARGA ---
            if (loading || dataLoading) return (
                <div className="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center overflow-hidden">
                    <div className="flex gap-6 mb-12">
                        <RealisticPaw className="paw-print p1" />
                        <RealisticPaw className="paw-print p2" />
                        <RealisticPaw className="paw-print p3" />
                    </div>
                    <div className="text-center z-10 px-8">
                        <h2 className="text-4xl font-black italic text-emerald-950 uppercase mb-2 tracking-tighter">GENERAL</h2>
                        <p className="text-slate-400 font-bold text-[10px] uppercase tracking-[0.4em]">Sincronizando tus ahorros...</p>
                    </div>
                    {/* GATA VIGILANTE ASOMÁNDOSE POR DEBAJO */}
                    <div className="absolute bottom-0 w-full flex justify-center translate-y-[20%] pointer-events-none">
                        <img src="1778434269697~2.png" alt="Gata" className="w-full max-w-sm h-auto" />
                    </div>
                </div>
            );

            // --- PANTALLA LOGIN ---
            if (!user) return (
                <div className="min-h-screen bg-emerald-900 flex flex-col items-center justify-center p-8 overflow-hidden">
                    <div className="bg-white rounded-[4rem] p-12 w-full max-w-md shadow-2xl text-center relative z-10 animate-in zoom-in duration-500">
                        <div className="bg-emerald-50 w-24 h-24 rounded-3xl flex items-center justify-center mx-auto mb-8 text-emerald-600 font-black text-4xl italic">$</div>
                        <h1 className="text-4xl font-black italic uppercase mb-2 tracking-tighter text-slate-900">VERDE APP</h1>
                        <p className="text-slate-400 font-bold mb-12 text-[11px] uppercase tracking-[0.2em] leading-relaxed px-4">Tus finanzas seguras y guardadas en la nube</p>
                        <button 
                            onClick={handleLogin}
                            className="w-full bg-slate-900 text-white py-6 rounded-[2.5rem] font-black uppercase tracking-widest shadow-xl active:scale-95 transition-all"
                        >
                            Ingresar con Google
                        </button>
                    </div>
                    <div className="absolute bottom-0 opacity-20 pointer-events-none translate-y-20">
                        <img src="1778434269697~2.png" alt="Cat" className="w-full max-w-md" />
                    </div>
                </div>
            );

            // --- DASHBOARD PRINCIPAL ---
            return (
                <div className="min-h-screen pb-44 no-scrollbar">
                    <header className={`${themeBg} pt-16 pb-32 px-8 rounded-b-[4.5rem] shadow-2xl transition-all duration-700 relative overflow-hidden`}>
                        <div className="max-w-xl mx-auto relative z-10 text-white">
                            <div className="flex justify-between items-center mb-12">
                                <h1 className="text-3xl font-black italic uppercase tracking-tighter">
                                    {activeTab === 'home' ? 'GENERAL' : activeTab === 'goals' ? 'OBJETIVOS' : 'DEUDAS'}
                                </h1>
                                <button onClick={() => auth.signOut()} className="bg-white/10 px-5 py-2.5 rounded-full border border-white/10 text-[10px] font-black uppercase tracking-widest">Salir</button>
                            </div>
                            <p className="text-white/60 text-[10px] font-black uppercase tracking-[0.2em] mb-2">{isDebtMode ? 'DEUDA PENDIENTE' : 'BALANCE DISPONIBLE'}</p>
                            <h2 className="text-6xl font-black tracking-tighter mb-12 animate-in fade-in duration-700">{isDebtMode ? totals.debts : totals.total}</h2>
                            
                            {activeTab === 'home' && (
                                <div className="grid grid-cols-2 gap-4 animate-in slide-in-from-top duration-700">
                                    <div className="bg-white/10 backdrop-blur-md p-6 rounded-[2.5rem] border border-white/10">
                                        <p className="text-[11px] font-black uppercase text-emerald-300 mb-1">Digital</p>
                                        <p className="text-2xl font-bold font-mono tracking-tight">{totals.digital}</p>
                                    </div>
                                    <div className="bg-white/10 backdrop-blur-md p-6 rounded-[2.5rem] border border-white/10">
                                        <p className="text-[11px] font-black uppercase text-amber-300 mb-1">Efectivo</p>
                                        <p className="text-2xl font-bold font-mono tracking-tight">{totals.cash}</p>
                                    </div>
                                </div>
                            )}
                        </div>
                        <div className="absolute top-0 right-0 w-96 h-96 bg-white/5 rounded-full blur-3xl -mr-20 -mt-20"></div>
                    </header>

                    <main className="max-w-xl mx-auto px-8 -mt-14 space-y-12 relative z-20">
                        {/* PESTAÑA: GENERAL */}
                        {activeTab === 'home' && (
                            <div className="space-y-12 animate-in fade-in">
                                <div className="flex gap-4">
                                    <button onClick={() => setShowModal('tx')} className="flex-1 bg-white p-8 rounded-[3.5rem] shadow-sm flex flex-col items-center justify-center font-black text-slate-500 uppercase text-xs active:scale-95 transition-all border border-slate-50">OPERAR</button>
                                    <button onClick={() => setShowModal('acc')} className="flex-1 bg-emerald-500 p-8 rounded-[3.5rem] shadow-xl text-emerald-950 font-black text-xs uppercase active:scale-95 transition-all">CUENTA</button>
                                </div>
                                <div className="space-y-4">
                                    {accounts.map(acc => (
                                        <div key={acc.id} className="bg-white p-7 rounded-[3rem] shadow-sm flex items-center justify-between group animate-in slide-in-from-right">
                                            <div>
                                                <p className="font-black text-slate-800 text-lg mb-1 leading-none">{acc.name}</p>
                                                <span className="text-[10px] font-black uppercase text-slate-400 tracking-wider">{acc.type === 'wallet' ? 'Virtual' : 'Efectivo'}</span>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <p className="font-black text-slate-900 text-xl tracking-tighter">${Number(acc.balance).toLocaleString('es-AR')}</p>
                                                <button onClick={() => db.collection(`users/${user.uid}/data/accounts`).doc(acc.id).delete()} className="text-rose-200 hover:text-rose-500 font-black text-xl px-2 transition-colors">×</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* PESTAÑA: OBJETIVOS */}
                        {activeTab === 'goals' && (
                            <div className="space-y-6 animate-in fade-in">
                                <button onClick={() => setShowModal('goal')} className="w-full bg-white border-2 border-dashed border-emerald-200 p-12 rounded-[4.5rem] font-black text-emerald-600 text-sm uppercase active:scale-95 transition-all">Nuevo Objetivo de Ahorro</button>
                                {goals.map(g => (
                                    <div key={g.id} className="bg-white p-8 rounded-[3.5rem] shadow-sm flex items-center justify-between group">
                                        <div>
                                            <p className="font-black text-slate-800 text-2xl leading-none mb-2">{g.name}</p>
                                            <p className="text-[11px] font-bold text-slate-400 uppercase tracking-widest">${g.currentAmount.toLocaleString()} ahorrados</p>
                                        </div>
                                        <button onClick={() => setShowModal({type:'save', id:g.id})} className="bg-emerald-600 text-white px-7 py-4 rounded-[1.5rem] font-black text-xs uppercase shadow-lg shadow-emerald-100 active:scale-90 transition-all">Sumar</button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* PESTAÑA: DEUDAS */}
                        {activeTab === 'debts' && (
                            <div className="space-y-6 animate-in fade-in">
                                <button onClick={() => setShowModal('debt')} className="w-full bg-white border-2 border-dashed border-rose-200 p-12 rounded-[4.5rem] font-black text-rose-600 text-sm uppercase active:scale-95 transition-all">Cargar Deuda Bancaria</button>
                                {debts.map(d => (
                                    <div key={d.id} className="bg-white p-8 rounded-[3.5rem] shadow-sm flex items-center justify-between group">
                                        <p className="font-black text-slate-800 text-2xl leading-none">{d.name}</p>
                                        <div className="flex items-center gap-4">
                                            <p className="font-black text-rose-600 text-3xl tracking-tighter">${Number(d.amount).toLocaleString()}</p>
                                            <button onClick={() => db.collection(`users/${user.uid}/data/debts`).doc(d.id).delete()} className="text-rose-200 hover:text-rose-500 font-black text-xl px-2">×</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* BARRA DE NAVEGACIÓN */}
                    <nav className="fixed bottom-10 left-1/2 -translate-x-1/2 w-[90%] max-w-sm z-[90]">
                        <div className="bg-slate-900/95 backdrop-blur-3xl px-12 py-8 rounded-[4rem] flex justify-between items-center shadow-[0_30px_70px_rgba(0,0,0,0.5)]">
                            <button onClick={() => setActiveTab('home')} className={`text-2xl transition-all ${activeTab === 'home' ? 'text-emerald-400 scale-125' : 'text-white/30'}`}>■</button>
                            <button onClick={() => setActiveTab('goals')} className={`text-2xl transition-all ${activeTab === 'goals' ? 'text-emerald-400 scale-125' : 'text-white/30'}`}>●</button>
                            <div className="relative">
                                <button onClick={() => setShowModal('tx')} className={`w-16 h-16 rounded-full flex items-center justify-center -mt-24 border-4 border-[#F8FAF9] text-3xl font-black transition-all shadow-xl active:scale-90 ${isDebtMode ? 'bg-rose-500' : 'bg-emerald-500'}`}>+</button>
                            </div>
                            <button onClick={() => setActiveTab('debts')} className={`text-2xl transition-all ${activeTab === 'debts' ? 'text-rose-400 scale-125' : 'text-white/30'}`}>▲</button>
                            <button className="text-white/30 text-2xl">H</button>
                        </div>
                    </nav>

                    {/* MODALES DINÁMICOS */}
                    {showModal && (
                        <div className="fixed inset-0 z-[1000] flex items-end sm:items-center justify-center bg-slate-950/80 backdrop-blur-md px-0 sm:px-4">
                            <div className="bg-white w-full max-w-md rounded-t-[5rem] sm:rounded-[4rem] p-12 shadow-2xl animate-in slide-in-from-bottom duration-500">
                                <div className="flex justify-between items-center mb-10">
                                    <h3 className="text-2xl font-black italic uppercase tracking-tighter">Cargar Datos</h3>
                                    <button onClick={() => setShowModal(null)} className="text-slate-300 font-black text-3xl p-2 hover:text-slate-500 transition-colors">×</button>
                                </div>
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const d = new FormData(e.target);
                                    const path = `users/${user.uid}/data`;
                                    
                                    if (showModal === 'acc') await db.collection(`${path}/accounts`).add({ name: d.get('n'), type: d.get('t'), balance: Number(d.get('b')) });
                                    if (showModal === 'goal') await db.collection(`${path}/goals`).add({ name: d.get('n'), targetAmount: Number(d.get('t')), currentAmount: 0, status: 'inactive' });
                                    if (showModal === 'debt') await db.collection(`${path}/debts`).add({ name: d.get('n'), amount: Number(d.get('a')) });
                                    if (showModal === 'tx') {
                                        const accId = d.get('acc');
                                        const acc = accounts.find(a => a.id === accId);
                                        const amt = Number(d.get('amt'));
                                        const newB = d.get('type') === 'i' ? Number(acc.balance) + amt : Number(acc.balance) - amt;
                                        await db.collection(`${path}/accounts`).doc(accId).update({ balance: newB });
                                    }
                                    if (showModal.type === 'save') {
                                        const amt = Number(d.get('amt'));
                                        const accId = d.get('acc');
                                        const acc = accounts.find(a => a.id === accId);
                                        const goal = goals.find(g => g.id === showModal.id);
                                        await db.collection(`${path}/accounts`).doc(accId).update({ balance: Number(acc.balance) - amt });
                                        await db.collection(`${path}/goals`).doc(showModal.id).update({ currentAmount: Number(goal.currentAmount) + amt });
                                    }
                                    setShowModal(null);
                                }} className="space-y-6">
                                    {showModal === 'acc' && <><input name="n" required placeholder="Nombre (ej. Galicia)" className="w-full p-5 bg-slate-50 rounded-[1.5rem] font-bold" /><select name="t" className="w-full p-5 bg-slate-50 rounded-[1.5rem] font-bold"><option value="wallet">Virtual / Banco</option><option value="cash">Efectivo Físico</option></select><input name="b" type="number" required placeholder="Monto actual" className="w-full p-5 bg-slate-50 rounded-[1.5rem] font-black text-2xl" /></>}
                                    {showModal === 'goal' && <><input name="n" required placeholder="¿Qué ahorramos?" className="w-full p-5 bg-slate-50 rounded-[1.5rem] font-bold" /><input name="t" type="number" required placeholder="Objetivo de ahorro $" className="w-full p-5 bg-slate-50 rounded-[1.5rem] font-black text-3xl" /></>}
                                    {showModal === 'debt' && <><input name="n" required placeholder="Nombre de entidad" className="w-full p-5 bg-slate-50 rounded-[1.5rem] font-bold" /><input name="a" type="number" required placeholder="Monto total $" className="w-full p-5 bg-slate-50 rounded-[1.5rem] font-black text-3xl text-rose-600 text-center" /></>}
                                    {(showModal === 'tx' || showModal.type === 'save') && <>
                                        <select name="acc" required className="w-full p-5 bg-slate-50 rounded-[1.5rem] font-bold">{accounts.map(a => <option key={a.id} value={a.id}>{a.name} (${a.balance})</option>)}</select>
                                        {showModal === 'tx' && <div className="flex gap-4"><label className="flex-1 p-4 bg-emerald-50 rounded-[1.5rem] text-center font-black text-xs cursor-pointer"><input type="radio" name="type" value="i" defaultChecked className="mr-2" /> INGRESO</label><label className="flex-1 p-4 bg-rose-50 rounded-[1.5rem] text-center font-black text-xs cursor-pointer"><input type="radio" name="type" value="g" className="mr-2" /> GASTO</label></div>}
                                        <input name="amt" type="number" required placeholder="Monto $" className="w-full p-6 bg-slate-50 rounded-[1.5rem] font-black text-5xl text-center" />
                                    </>}
                                    <button className="w-full bg-slate-900 text-white py-6 rounded-[2rem] font-black uppercase tracking-widest mt-4 shadow-xl active:scale-95 transition-all">Confirmar Datos</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
