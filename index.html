<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cydonia Industries - Finance Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #F8FAF9; margin: 0; touch-action: manipulation; overflow-x: hidden; }
        .paw { animation: walk 1.2s infinite ease-in-out; }
        @keyframes walk { 0%, 100% { opacity: 0.1; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.1); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .num-font { font-variant-numeric: tabular-nums; }
        .menu-in { animation: menuIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes menuIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDtmxXb4wdkelAGeISytgj5JqQ3BGZvpzM",
            authDomain: "billetera-personal-d4ca9.firebaseapp.com",
            projectId: "billetera-personal-d4ca9",
            storageBucket: "billetera-personal-d4ca9.firebasestorage.app",
            messagingSenderId: "762760084018",
            appId: "1:762760084018:web:de9213b7defd8e1dc11a2b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const provider = new firebase.auth.GoogleAuthProvider();

        const Icon = {
            Home: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>,
            Target: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            Debt: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><path d="M7 15l2.5-2.5 2.5 2.5" transform="rotate(180 9.5 15)"/></svg>,
            Plus: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="3.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Play: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>,
            Pause: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>,
            Dots: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>,
            Swap: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M7 16l-4-4 4-4m10 0l4 4-4 4m-12-4h16"/></svg>,
            Dollar: () => <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
            Trash: () => <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            History: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M12 8v4l3 3"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/></svg>,
            Paw: ({ className }) => ( <svg viewBox="0 0 100 100" className={className} fill="currentColor"><path d="M50 85c-12 0-22-8-22-22 0-12 10-22 22-22s22 10 22 22c0 14-10 22-22 22zM28 38c-5 0-9-4-9-9s4-9 9-9 9 4 9 9-4 9-9 9zm16-14c-5 0-9-4-9-9s4-9 9-9 9 4 9 9-4 9-9 9zm24 0c-5 0-9-4-9-9s4-9 9-9 9 4 9 9-4 9-9 9zm16 14c-5 0-9-4-9-9s4-9 9-9 9 4 9 9-4 9-9 9z" /></svg>)
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [accounts, setAccounts] = useState([]);
            const [modal, setModal] = useState({ open: false, type: '', data: null });

            useEffect(() => { auth.onAuthStateChanged(setUser); }, []);
            useEffect(() => {
                if (!user) return;
                return db.collection(`usuarios/${user.uid}/cuentas`).onSnapshot(s => setAccounts(s.docs.map(d => ({id: d.id, ...d.data()}))));
            }, [user]);

            if (!user) return (
                <div className="h-screen flex items-center justify-center bg-emerald-800">
                    <button onClick={() => auth.signInWithPopup(provider)} className="bg-white px-8 py-4 rounded-full font-black uppercase text-emerald-900">Ingresar con Google</button>
                </div>
            );

            return (
                <div className="p-6 max-w-md mx-auto space-y-6">
                    <h1 className="text-2xl font-black text-emerald-900 italic uppercase tracking-tighter">Cydonia Finance</h1>
                    <div className="space-y-4">
                        {accounts.map(acc => (
                            <div key={acc.id} className="bg-white p-6 rounded-3xl shadow flex justify-between items-center">
                                <div>
                                    <p className="font-bold">{acc.name}</p>
                                    <p className="text-[10px] uppercase font-black opacity-40">{acc.currency}</p>
                                </div>
                                <p className="font-black text-xl">${Number(acc.balance).toLocaleString()}</p>
                            </div>
                        ))}
                    </div>
                    <button onClick={() => setModal({open: true, type: 'acc'})} className="w-full bg-emerald-500 py-4 rounded-full font-black text-white">Nueva Cuenta</button>
                    {modal.open && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-6">
                            <form className="bg-white p-8 rounded-3xl w-full" onSubmit={async (e) => {
                                e.preventDefault();
                                const d = new FormData(e.target);
                                await db.collection(`usuarios/${user.uid}/cuentas`).add({ name: d.get('n'), currency: d.get('c'), balance: Number(d.get('b')) });
                                setModal({open: false, type: '', data: null});
                            }}>
                                <input name="n" placeholder="Nombre" className="w-full p-4 bg-slate-100 rounded-xl mb-4" required />
                                <select name="c" className="w-full p-4 bg-slate-100 rounded-xl mb-4"><option value="ARS">Pesos</option><option value="USD">Dólares</option></select>
                                <input name="b" type="number" placeholder="Saldo" className="w-full p-4 bg-slate-100 rounded-xl mb-4" required />
                                <button className="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase">Guardar</button>
                            </form>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
