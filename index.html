<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billetera Virtual</title>

  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML = '<div style="padding: 20px; margin: 20px; background-color: #ffebee; color: #c62828; font-family: sans-serif; border-radius: 10px; border: 2px solid #ef5350;"><h3>🚨 ERROR EN LA APP:</h3><p><b>Mensaje:</b> ' + e.message + '</p><p><b>Línea:</b> ' + e.lineno + '</p><p>Avisale a Gemini para corregirlo.</p></div>';
    });
  </script>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .num-font { font-family: 'Courier New', Courier, monospace; letter-spacing: -1px; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
        apiKey: "AIzaSyDtmxXb4wdkelAGeISytgj5JqQ3BGZvpzM",
        authDomain: "billetera-personal-d4ca9.firebaseapp.com",
        projectId: "billetera-personal-d4ca9",
        storageBucket: "billetera-personal-d4ca9.firebasestorage.app",
        messagingSenderId: "762760084018",
        appId: "1:762760084018:web:de9213b7defd8e1dc11a2b"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const provider = new firebase.auth.GoogleAuthProvider();

    // Tus íconos personalizados originales (¡Sin chocar con nada!)
    const CustomIcon = {
        Home: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>,
        Target: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
        Debt: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><path d="M7 15l2.5-2.5 2.5 2.5" transform="rotate(180 9.5 15)"/></svg>,
        Plus: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="3.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
        Trash: () => <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
        Dollar: () => <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    };

    const App = () => {
        const { useState, useEffect, useMemo } = React;
        const [user, setUser] = useState(null);
        const [loading, setLoading] = useState(true);
        const [activeTab, setActiveTab] = useState('home'); 
        const [accounts, setAccounts] = useState([]);

        useEffect(() => {
            return auth.onAuthStateChanged((u) => {
                setUser(u);
                setLoading(false);
            });
        }, []);

        useEffect(() => {
            if (!user) return;
            const path = `usuarios/${user.uid}`;
            const unsubAcc = db.collection(`${path}/cuentas`).onSnapshot(s => setAccounts(s.docs.map(d => ({id: d.id, ...d.data()}))));
            return () => { unsubAcc(); };
        }, [user]);

        const stats = useMemo(() => {
            const accs = accounts || [];
            const arsTotal = accs.filter(a => a.currency !== 'USD').reduce((s, a) => s + Number(a.balance || 0), 0);
            return { ars: new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(arsTotal) };
        }, [accounts]);

        const addAccount = () => {
            const name = prompt("Nombre de la cuenta:");
            if (!name) return;
            const balance = Number(prompt("Saldo inicial:") || 0);
            db.collection(`usuarios/${user.uid}/cuentas`).add({ name, balance, currency: 'ARS' });
        };

        if (loading) return <div className="min-h-screen flex items-center justify-center font-black text-emerald-600">CARGANDO...</div>;

        if (!user) return (
            <div className="min-h-screen flex flex-col items-center justify-center bg-slate-900 px-6">
                <div className="w-full max-w-md">
                    <h1 className="text-white text-4xl font-black mb-8 text-center italic">MI BILLETERA</h1>
                    <button onClick={() => auth.signInWithPopup(provider)} className="w-full bg-emerald-500 text-slate-900 py-6 rounded-[2.5rem] font-black uppercase tracking-widest shadow-2xl">Ingresar con Google</button>
                </div>
            </div>
        );

        return (
            <div className="min-h-screen pb-44 bg-gray-100">
                <header className="bg-emerald-800 pt-16 pb-28 px-8 rounded-b-[4.5rem] shadow-2xl text-white">
                    <div className="max-w-xl mx-auto flex justify-between items-center mb-6">
                        <h1 className="text-3xl font-black uppercase tracking-tighter">GENERAL</h1>
                        <button onClick={() => auth.signOut()} className="bg-white/10 px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest">SALIR</button>
                    </div>
                    <div className="max-w-xl mx-auto">
                        <p className="text-white/60 text-[10px] font-black uppercase tracking-widest mb-1">BALANCE TOTAL</p>
                        <h2 className="text-5xl font-black tracking-tighter num-font leading-none">{stats.ars}</h2>
                    </div>
                </header>
                
                <main className="max-w-xl mx-auto px-6 -mt-12 space-y-6 relative z-20">
                    <button onClick={addAccount} className="w-full bg-white p-6 rounded-[2rem] font-black text-emerald-600 flex items-center justify-center gap-2 shadow-xl active:scale-95 transition-all">
                        <CustomIcon.Plus /> AGREGAR CUENTA
                    </button>
                    
                    <div className="space-y-4">
                        {accounts.map(acc => (
                            <div key={acc.id} className="bg-white p-6 rounded-[2rem] flex justify-between items-center shadow-sm">
                                <span className="font-black text-slate-800 text-lg">{acc.name}</span>
                                <div className="flex items-center gap-4">
                                    <span className="font-black text-emerald-600 text-xl">${Number(acc.balance || 0).toLocaleString('es-AR')}</span>
                                    <button onClick={() => { if(confirm("¿Borrar cuenta?")) db.collection(`usuarios/${user.uid}/cuentas`).doc(acc.id).delete() }} className="text-slate-200 hover:text-rose-500 transition-colors"><CustomIcon.Trash /></button>
                                </div>
                            </div>
                        ))}
                    </div>
                </main>

                {/* BARRA DE NAVEGACIÓN INFERIOR */}
                <nav className="fixed bottom-6 left-6 right-6 bg-slate-900 p-4 rounded-[3rem] shadow-2xl flex justify-around items-center z-50">
                    <button onClick={() => setActiveTab('home')} className={`p-4 rounded-[2rem] transition-all ${activeTab === 'home' ? 'bg-emerald-500 text-emerald-950 shadow-lg' : 'text-slate-400'}`}>
                        <CustomIcon.Home />
                    </button>
                    <button onClick={() => alert("Sección Objetivos se activará tras verificar la base")} className="p-4 rounded-[2rem] text-slate-400">
                        <CustomIcon.Target />
                    </button>
                    <button onClick={() => alert("Sección Deudas se activará tras verificar la base")} className="p-4 rounded-[2rem] text-slate-400">
                        <CustomIcon.Debt />
                    </button>
                </nav>
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
