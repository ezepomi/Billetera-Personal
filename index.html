<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billetera Personal - Gato Vigilante</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden;
        }
        
        /* Animación de huellas reales */
        @keyframes pawWalk {
            0%, 100% { transform: scale(0.9); opacity: 0.2; }
            50% { transform: scale(1.1) translateY(-10px); opacity: 1; }
        }
        .animate-paw { animation: pawWalk 1.5s infinite ease-in-out; }
        
        /* Ocultar scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animación suave para cambios de pestaña */
        .tab-transition { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-[#F8FAF9]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONFIGURACIÓN DE FIREBASE (Tus datos reales) ---
        const firebaseConfig = {
            apiKey: "AIzaSyDtmxXb4wdkelAGeISytgj5JqQ3BGZvpzM",
            authDomain: "billetera-personal-d4ca9.firebaseapp.com",
            projectId: "billetera-personal-d4ca9",
            storageBucket: "billetera-personal-d4ca9.firebasestorage.app",
            messagingSenderId: "762760084018",
            appId: "1:762760084018:web:de9213b7defd8e1dc11a2b"
        };

        // Imports desde CDN
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, addDoc, deleteDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Iconos manuales (SVG)
        const Icons = {
            Wallet: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/><path d="M16 12h5"/></svg>,
            Plus: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
            Target: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            Alert: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            Grid: () => <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
            Trash: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
            Play: () => <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>,
            LogOut: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        };

        const RealisticPaw = ({ delay }) => (
            <div className="animate-paw" style={{ animationDelay: delay }}>
                <svg width="45" height="45" viewBox="0 0 100 100" fill="currentColor" className="text-emerald-600">
                    <path d="M50 85 C 35 85, 25 75, 25 60 C 25 45, 35 35, 50 35 C 65 35, 75 45, 75 60 C 75 75, 65 85, 50 85" />
                    <ellipse cx="25" cy="35" rx="10" ry="14" />
                    <ellipse cx="42" cy="20" rx="10" ry="14" />
                    <ellipse cx="58" cy="20" rx="10" ry="14" />
                    <ellipse cx="75" cy="35" rx="10" ry="14" />
                </svg>
            </div>
        );

        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [activeTab, setActiveTab] = useState('home'); // home, goals, debts
            const [accounts, setAccounts] = useState([]);
            const [goals, setGoals] = useState([]);
            const [debts, setDebts] = useState([]);
            const [showModal, setShowModal] = useState(null);

            const isDebtMode = activeTab === 'debts';
            const themeBg = isDebtMode ? 'bg-rose-800' : 'bg-emerald-800';
            const accentColor = isDebtMode ? 'text-rose-600' : 'text-emerald-600';

            const currentTitle = useMemo(() => {
                if (activeTab === 'goals') return 'OBJETIVOS';
                if (activeTab === 'debts') return 'DEUDAS';
                return 'GENERAL';
            }, [activeTab]);

            useEffect(() => {
                const unsubAuth = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (!u) setLoading(false);
                });
                return () => unsubAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const path = `users/${user.uid}`;
                const unsubAcc = onSnapshot(collection(db, path, 'accounts'), (s) => setAccounts(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubGoals = onSnapshot(collection(db, path, 'goals'), (s) => setGoals(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const unsubDebts = onSnapshot(collection(db, path, 'debts'), (s) => {
                    setDebts(s.docs.map(d => ({id:d.id, ...d.data()})));
                    // Tiempo de carga para ver al gato vigilando
                    setTimeout(() => setLoading(false), 3500);
                });
                return () => { unsubAcc(); unsubGoals(); unsubDebts(); };
            }, [user]);

            const totals = useMemo(() => {
                const digital = accounts.filter(a => a.type === 'wallet').reduce((s,a) => s + Number(a.balance), 0);
                const cash = accounts.filter(a => a.type === 'cash').reduce((s,a) => s + Number(a.balance), 0);
                const debt = debts.reduce((s,d) => s + Number(d.amount), 0);
                const fmt = (v) => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(v);
                return { total: fmt(digital+cash), digital: fmt(digital), cash: fmt(cash), debts: fmt(debt) };
            }, [accounts, debts]);

            // --- VISTA CARGA ---
            if (loading) return (
                <div className="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center overflow-hidden">
                    <div className="flex gap-6 mb-12">
                        <RealisticPaw delay="0s" />
                        <RealisticPaw delay="0.2s" />
                        <RealisticPaw delay="0.4s" />
                    </div>
                    <div className="text-center z-10">
                        <h2 className="text-5xl font-black italic text-emerald-950 uppercase tracking-tighter mb-2 animate-pulse">GENERAL</h2>
                        <p className="text-slate-400 font-bold text-xs uppercase tracking-[0.5em]">Sincronizando datos...</p>
                    </div>
                    {/* GATA VIGILANTE ASOMÁNDOSE */}
                    <div className="absolute bottom-0 left-0 right-0 flex justify-center pointer-events-none translate-y-[20%]">
                        <img src="1778434269697~2.png" alt="Gata Vigilante" className="w-full max-w-[450px] object-contain" />
                    </div>
                </div>
            );

            // --- VISTA LOGIN ---
            if (!user) return (
                <div className="min-h-screen bg-emerald-900 flex flex-col items-center justify-center p-8 overflow-hidden">
                    <div className="bg-white rounded-[4rem] p-12 w-full max-w-md shadow-2xl text-center relative z-10">
                        <div className="bg-emerald-50 w-24 h-24 rounded-3xl flex items-center justify-center mx-auto mb-8 text-emerald-600">
                            <Icons.Wallet />
                        </div>
                        <h1 className="text-4xl font-black italic uppercase mb-4 tracking-tighter text-slate-900">VERDE APP</h1>
                        <p className="text-slate-400 font-medium mb-12 uppercase text-[10px] tracking-widest leading-loose">Tu progreso guardado en la nube</p>
                        <button 
                            onClick={() => signInWithPopup(auth, provider)}
                            className="w-full bg-slate-900 text-white py-6 rounded-3xl font-black uppercase tracking-widest shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3"
                        >
                            Ingresar con Google
                        </button>
                    </div>
                    <div className="absolute bottom-0 opacity-20 pointer-events-none translate-y-16">
                        <img src="1778434269697~2.png" alt="Gatito" className="w-full max-w-md" />
                    </div>
                </div>
            );

            // --- VISTA PRINCIPAL ---
            return (
                <div className="min-h-screen pb-44 no-scrollbar">
                    <header className={`${themeBg} pt-16 pb-28 px-8 rounded-b-[4.5rem] shadow-2xl transition-colors duration-700 relative overflow-hidden`}>
                        <div className="max-w-xl mx-auto relative z-10 text-white">
                            <div className="flex justify-between items-center mb-10">
                                <div className="flex items-center gap-4">
                                    <div className="bg-white/20 p-3 rounded-2xl backdrop-blur-md">
                                        {activeTab === 'home' ? <Icons.Wallet /> : activeTab === 'goals' ? <Icons.Target /> : <Icons.Alert />}
                                    </div>
                                    <h1 className="text-3xl font-black italic tracking-tighter uppercase">{currentTitle}</h1>
                                </div>
                                <button onClick={() => signOut(auth)} className="bg-white/10 p-3 rounded-full border border-white/10 hover:bg-white/20"><Icons.LogOut /></button>
                            </div>
                            
                            <p className="text-white/60 text-[11px] font-black uppercase tracking-[0.2em] mb-2">{isDebtMode ? 'Deuda Acumulada' : 'Balance Total'}</p>
                            <h2 className="text-6xl font-black tracking-tighter mb-12 animate-in fade-in">{isDebtMode ? totals.debts : totals.total}</h2>
                            
                            {activeTab === 'home' && (
                                <div className="grid grid-cols-2 gap-4 animate-in slide-in-from-top duration-500">
                                    <div className="bg-white/10 backdrop-blur-md p-6 rounded-[2.5rem] border border-white/10">
                                        <p className="text-[11px] font-black uppercase text-emerald-300 mb-1">Digital</p>
                                        <p className="text-2xl font-bold font-mono tracking-tight">{totals.digital}</p>
                                    </div>
                                    <div className="bg-white/10 backdrop-blur-md p-6 rounded-[2.5rem] border border-white/10">
                                        <p className="text-[11px] font-black uppercase text-amber-300 mb-1">Efectivo</p>
                                        <p className="text-2xl font-bold font-mono tracking-tight">{totals.cash}</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="max-w-xl mx-auto px-8 -mt-12 space-y-12 relative z-20">
                        {/* GENERAL */}
                        {activeTab === 'home' && (
                            <div className="space-y-12 animate-in fade-in">
                                <div className="flex gap-5">
                                    <button onClick={() => setShowModal('tx')} className="flex-1 bg-white p-8 rounded-[3.5rem] shadow-sm flex flex-col items-center gap-3 active:scale-95 transition-all border border-slate-50">
                                        <div className="bg-emerald-50 p-4 rounded-3xl text-emerald-600"><Icons.Plus /></div>
                                        <span className="text-xs font-black uppercase tracking-widest text-slate-500">Operar</span>
                                    </button>
                                    <button onClick={() => setShowModal('acc')} className="flex-1 bg-emerald-500 p-8 rounded-[3.5rem] shadow-xl text-emerald-950 flex flex-col items-center gap-3 active:scale-95 transition-all">
                                        <Icons.Plus />
                                        <span className="text-xs font-black uppercase tracking-widest">Cuenta</span>
                                    </button>
                                </div>
                                <section className="space-y-4">
                                    <div className="flex items-center gap-3 px-4">
                                        <div className="w-2 h-6 bg-emerald-500 rounded-full"></div>
                                        <h3 className="font-black text-slate-800 uppercase tracking-widest text-[11px] opacity-40">Mis Activos</h3>
                                    </div>
                                    {accounts.length === 0 && <div className="p-16 text-center text-slate-300 font-bold uppercase tracking-widest text-xs bg-white rounded-[3.5rem]">Vacío</div>}
                                    {accounts.map(acc => (
                                        <div key={acc.id} className="bg-white p-7 rounded-[3.5rem] shadow-sm flex items-center justify-between group animate-in slide-in-from-right">
                                            <div className="flex items-center gap-6">
                                                <div className={`p-4 rounded-[1.5rem] ${acc.type === 'wallet' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}`}>
                                                    {acc.type === 'wallet' ? <Smartphone size={24}/> : <Coins size={24}/>}
                                                </div>
                                                <div>
                                                    <p className="font-black text-slate-800 text-lg leading-none mb-2">{acc.name}</p>
                                                    <span className="text-[10px] font-black uppercase text-slate-400">{acc.type === 'wallet' ? 'Digital' : 'Efectivo'}</span>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <p className="font-black text-slate-900 text-xl tracking-tighter">${Number(acc.balance).toLocaleString('es-AR')}</p>
                                                <button onClick={() => deleteDoc(doc(db, `users/${user.uid}/accounts`, acc.id))} className="text-slate-100 hover:text-red-400 p-2 opacity-0 group-hover:opacity-100 transition-all"><Icons.Trash /></button>
                                            </div>
                                        </div>
                                    ))}
                                </section>
                            </div>
                        )}

                        {/* OBJETIVOS */}
                        {activeTab === 'goals' && (
                            <div className="space-y-6 animate-in fade-in">
                                <button onClick={() => setShowModal('goal')} className="w-full bg-white border-2 border-dashed border-emerald-200 p-12 rounded-[4.5rem] flex flex-col items-center gap-4 text-emerald-600 hover:bg-emerald-50">
                                    <Icons.Target />
                                    <span className="font-black uppercase text-xs tracking-[0.2em]">Nueva Meta de Ahorro</span>
                                </button>
                                {goals.map(g => (
                                    <div key={g.id} className="bg-white p-8 rounded-[3.5rem] shadow-sm flex items-center justify-between group">
                                        <div className="flex items-center gap-6">
                                            <div className="bg-emerald-50 text-emerald-700 p-4 rounded-3xl font-black text-xs min-w-[70px] text-center">
                                                {Math.round((g.currentAmount/g.targetAmount)*100)}%
                                            </div>
                                            <div>
                                                <p className="font-black text-slate-800 text-2xl leading-tight mb-1">{g.name}</p>
                                                <p className="text-[11px] font-bold text-slate-400 uppercase tracking-widest">${g.currentAmount.toLocaleString()} de ${g.targetAmount.toLocaleString()}</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-2">
                                            {g.status === 'inactive' ? (
                                                <button onClick={() => updateDoc(doc(db, `users/${user.uid}/goals`, g.id), { status: 'active' })} className="text-emerald-600 p-3 hover:scale-110 transition-transform"><Icons.Play /></button>
                                            ) : (
                                                <button onClick={() => setShowModal({type:'save', id:g.id})} className="bg-emerald-600 text-white px-6 py-4 rounded-2xl font-black text-[11px] uppercase tracking-widest shadow-lg shadow-emerald-100">Sumar</button>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* DEUDAS */}
                        {activeTab === 'debts' && (
                            <div className="space-y-6 animate-in fade-in">
                                <button onClick={() => setShowModal('debt')} className="w-full bg-white border-2 border-dashed border-rose-200 p-12 rounded-[4.5rem] flex flex-col items-center gap-4 text-rose-600 hover:bg-rose-50">
                                    <Icons.Alert />
                                    <span className="font-black uppercase text-xs tracking-[0.2em]">Cargar Deuda Bancaria</span>
                                </button>
                                {debts.map(d => (
                                    <div key={d.id} className="bg-white p-8 rounded-[3.5rem] shadow-sm flex items-center justify-between group">
                                        <div className="flex items-center gap-6">
                                            <div className="bg-rose-50 text-rose-600 p-5 rounded-[2rem]"><TrendingDown size={36}/></div>
                                            <p className="font-black text-slate-800 text-2xl leading-tight">{d.name}</p>
                                        </div>
                                        <div className="flex items-center gap-4">
                                            <p className="font-black text-rose-600 text-3xl tracking-tighter">${Number(d.amount).toLocaleString()}</p>
                                            <button onClick={() => deleteDoc(doc(db, `users/${user.uid}/debts`, d.id))} className="text-slate-100 hover:text-red-400 p-2 opacity-0 group-hover:opacity-100 transition-all"><Icons.Trash /></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-10 left-1/2 -translate-x-1/2 w-[92%] max-w-sm z-[90]">
                        <div className="bg-slate-900/90 backdrop-blur-3xl px-12 py-7 rounded-[4rem] flex justify-between items-center shadow-[0_30px_70px_rgba(0,0,0,0.5)]">
                            <button onClick={() => setActiveTab('home')} className={activeTab === 'home' ? 'text-emerald-400 scale-125 transition-all' : 'text-white/30'}><Icons.Grid /></button>
                            <button onClick={() => setActiveTab('goals')} className={activeTab === 'goals' ? 'text-emerald-400 scale-125 transition-all' : 'text-white/30'}><Icons.Target /></button>
                            <div className="relative">
                                <button onClick={() => setShowModal('tx')} className={`w-16 h-16 rounded-full flex items-center justify-center -mt-24 border-4 border-[#F8FAF9] shadow-2xl text-slate-950 active:scale-90 transition-all ${activeTab === 'debts' ? 'bg-rose-500' : 'bg-emerald-500'}`}>
                                    <Icons.Plus />
                                </button>
                            </div>
                            <button onClick={() => setActiveTab('debts')} className={activeTab === 'debts' ? 'text-rose-400 scale-125 transition-all' : 'text-white/30'}><Icons.Alert /></button>
                            <button className="text-white/30"><Icons.History /></button>
                        </div>
                    </nav>

                    {/* MODALES */}
                    {showModal && (
                        <div className="fixed inset-0 z-[1000] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-950/80 backdrop-blur-md">
                            <div className="bg-white w-full max-w-md rounded-t-[5rem] sm:rounded-[4rem] p-12 shadow-2xl animate-in slide-in-from-bottom duration-500">
                                <div className="flex justify-between items-center mb-10 uppercase italic font-black text-2xl tracking-tighter">
                                    <h3>{showModal === 'acc' ? 'Nueva Cuenta' : showModal === 'goal' ? 'Nueva Meta' : showModal === 'debt' ? 'Cargar Deuda' : 'Movimiento'}</h3>
                                    <button onClick={() => setShowModal(null)} className="text-slate-300 p-2"><X size={32}/></button>
                                </div>
                                <form onSubmit={async (e) => {
                                    e.preventDefault();
                                    const d = new FormData(e.target);
                                    const path = `users/${user.uid}`;
                                    if (showModal === 'acc') await addDoc(collection(db, path, 'accounts'), { name: d.get('n'), type: d.get('t'), balance: Number(d.get('b')), createdAt: serverTimestamp() });
                                    if (showModal === 'goal') await addDoc(collection(db, path, 'goals'), { name: d.get('n'), targetAmount: Number(d.get('t')), currentAmount: 0, status: 'inactive', createdAt: serverTimestamp() });
                                    if (showModal === 'debt') await addDoc(collection(db, path, 'debts'), { name: d.get('n'), amount: Number(d.get('a')), createdAt: serverTimestamp() });
                                    if (showModal === 'tx') {
                                        const accId = d.get('acc');
                                        const acc = accounts.find(a => a.id === accId);
                                        const amt = Number(d.get('amt'));
                                        const newB = d.get('type') === 'i' ? Number(acc.balance) + amt : Number(acc.balance) - amt;
                                        await updateDoc(doc(db, path, 'accounts', accId), { balance: newB });
                                    }
                                    if (showModal.type === 'save') {
                                        const amt = Number(d.get('amt'));
                                        const accId = d.get('acc');
                                        const acc = accounts.find(a => a.id === accId);
                                        const goal = goals.find(g => g.id === showModal.id);
                                        await updateDoc(doc(db, path, 'accounts', accId), { balance: Number(acc.balance) - amt });
                                        await updateDoc(doc(db, path, 'goals', showModal.id), { currentAmount: Number(goal.currentAmount) + amt });
                                    }
                                    setShowModal(null);
                                }} className="space-y-6">
                                    {showModal === 'acc' && <><input name="n" required placeholder="Nombre (ej. Galicia)" className="w-full p-5 bg-slate-50 rounded-3xl font-bold" /><select name="t" className="w-full p-5 bg-slate-50 rounded-3xl font-bold"><option value="wallet">Virtual / Banco</option><option value="cash">Efectivo Físico</option></select><input name="b" type="number" required placeholder="Monto actual" className="w-full p-5 bg-slate-50 rounded-3xl font-black text-2xl" /></>}
                                    {showModal === 'goal' && <><input name="n" required placeholder="Nombre de meta" className="w-full p-5 bg-slate-50 rounded-3xl font-bold" /><input name="t" type="number" required placeholder="Objetivo $" className="w-full p-5 bg-slate-50 rounded-3xl font-black text-3xl" /></>}
                                    {showModal === 'debt' && <><input name="n" required placeholder="Entidad" className="w-full p-5 bg-slate-50 rounded-3xl font-bold" /><input name="a" type="number" required placeholder="Monto $" className="w-full p-5 bg-slate-50 rounded-3xl font-black text-3xl text-rose-600 text-center" /></>}
                                    {(showModal === 'tx' || showModal.type === 'save') && <>
                                        <select name="acc" required className="w-full p-5 bg-slate-50 rounded-3xl font-bold">{accounts.map(a => <option key={a.id} value={a.id}>{a.name} (${a.balance})</option>)}</select>
                                        {showModal === 'tx' && <div className="flex gap-4"><label className="flex-1 p-4 bg-emerald-50 rounded-2xl text-center font-black text-xs cursor-pointer"><input type="radio" name="type" value="i" defaultChecked className="mr-2" /> INGRESO</label><label className="flex-1 p-4 bg-rose-50 rounded-2xl text-center font-black text-xs cursor-pointer"><input type="radio" name="type" value="g" className="mr-2" /> GASTO</label></div>}
                                        <input name="amt" type="number" required placeholder="Monto $" className="w-full p-6 bg-slate-50 rounded-3xl font-black text-5xl text-center" />
                                    </>}
                                    <button className="w-full bg-slate-900 text-white py-6 rounded-3xl font-black uppercase tracking-widest mt-4 hover:bg-slate-800 shadow-xl">Confirmar</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
