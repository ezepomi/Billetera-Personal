<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Debug Mode</title>
    <script>
        // Esto captura cualquier error de JavaScript y lo muestra en pantalla
        window.onerror = function(msg, url, line) {
            document.body.innerHTML = '<div style="color:red; font-family:monospace; padding:20px;"><h1>Error detectado:</h1><p>' + msg + '</p><p>Línea: ' + line + '</p></div>';
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            return (
                <div className="p-10 bg-blue-500 text-white font-black text-2xl">
                    ¡HOLA! Si ves esto, el archivo funciona.
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
